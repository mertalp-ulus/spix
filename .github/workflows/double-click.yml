name: Qt Quick double-click

on:
  push:
    branches: ['feature/double-click']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-qt6:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jdpurcell/install-qt-action@v5
        with:
          version: '6.11.0'
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install test dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install anyrpc gtest --classic --triplet=x64-windows --x-install-root="$env:GITHUB_WORKSPACE/deps-install"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE/deps-install/x64-windows/bin" >> $env:GITHUB_PATH
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DSPIX_QT_MAJOR=6 -DSPIX_BUILD_TESTS=ON -DSPIX_BUILD_EXAMPLES=OFF -DSPIX_BUILD_QTQUICK=ON -DSPIX_BUILD_QTWIDGETS=ON -DAnyRPC_ROOT="${{ github.workspace }}/deps-install/x64-windows" -DGTest_ROOT="${{ github.workspace }}/deps-install/x64-windows"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QSG_RHI_BACKEND: software
        run: ctest --test-dir build --output-on-failure
      - name: Repeat gesture tests
        run: ctest --test-dir build -R '^SpixQtQuickGestureTests$' --repeat until-fail:100 --output-on-failure
